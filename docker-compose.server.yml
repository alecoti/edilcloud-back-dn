services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.runtime/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./.runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  wordpress-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    volumes:
      - ./.runtime/mariadb:/var/lib/mysql
    ports:
      - "${WORDPRESS_DB_BIND_IP}:${WORDPRESS_DB_PORT}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u${WORDPRESS_DB_USER} -p${WORDPRESS_DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  web-blue:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: edilcloud.settings.prod
      DEBUG: "false"
      DEPLOY_SLOT: blue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_IP}:${BACKEND_BLUE_PORT:-18001}:8001"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./.tmp/test-center:/app/.tmp/test-center
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_services.py db:5432 redis:6379 &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        exec gunicorn edilcloud.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001 --workers ${GUNICORN_WORKERS:-4} --timeout 120
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8001/api/v1/health', headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-green:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: edilcloud.settings.prod
      DEBUG: "false"
      DEPLOY_SLOT: green
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_IP}:${BACKEND_GREEN_PORT:-18002}:8001"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./.tmp/test-center:/app/.tmp/test-center
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_services.py db:5432 redis:6379 &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        exec gunicorn edilcloud.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001 --workers ${GUNICORN_WORKERS:-4} --timeout 120
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8001/api/v1/health', headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  assistant-worker-blue:
    build:
      context: .
    restart: on-failure
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: edilcloud.settings.prod
      DEBUG: "false"
      DEPLOY_SLOT: blue
    depends_on:
      web-blue:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_services.py db:5432 redis:6379 &&
        exec python manage.py run_assistant_indexer --sleep-seconds ${ASSISTANT_INDEXER_POLL_SECONDS:-10} --batch-size ${ASSISTANT_INDEXER_BATCH_SIZE:-4}

  assistant-worker-green:
    build:
      context: .
    restart: on-failure
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: edilcloud.settings.prod
      DEBUG: "false"
      DEPLOY_SLOT: green
    depends_on:
      web-green:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_services.py db:5432 redis:6379 &&
        exec python manage.py run_assistant_indexer --sleep-seconds ${ASSISTANT_INDEXER_POLL_SECONDS:-10} --batch-size ${ASSISTANT_INDEXER_BATCH_SIZE:-4}

  loadtest-runner:
    build:
      context: .
    profiles:
      - tools
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: edilcloud.settings.prod
      DEBUG: "false"
    volumes:
      - ./.tmp/test-center:/app/.tmp/test-center
    command:
      - python
      - scripts/run_locust_suite.py

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_BIND_PORT:-19090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.runtime/prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/config.yml:ro
      - ./.runtime/loki:/loki

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/config.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - ./.runtime/tempo:/var/tempo

  alloy:
    image: grafana/alloy:v1.9.2
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.runtime/alloy:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-publication}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000}
    ports:
      - "127.0.0.1:${GRAFANA_BIND_PORT:-13000}:3000"
    volumes:
      - ./.runtime/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

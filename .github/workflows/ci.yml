name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: edilcloud_ci
          POSTGRES_USER: edilcloud_ci
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edilcloud_ci -d edilcloud_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SETTINGS_MODULE: tests.ci_postgres_settings

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip install --upgrade pip && python -m pip install -e ".[dev]" && break
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after ${attempt} attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install PDF test browser
        run: python -m playwright install --with-deps chromium

      - name: Compile operational scripts
        run: python -m py_compile scripts/*.py

      - name: Migration drift check
        run: python manage.py makemigrations --dry-run --check --settings=tests.ci_postgres_settings

      - name: Django system check
        run: python manage.py check --settings=tests.ci_postgres_settings

      - name: Backend test suite
        run: pytest -q

  notify_failure:
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Send failure email
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FAILURE_EMAIL_TO: a.coti1987@gmail.com
          CI_FAILURE_SMTP_HOST: smtp.gmail.com
          CI_FAILURE_SMTP_PORT: "465"
          CI_FAILURE_SMTP_USERNAME: ${{ secrets.CI_FAILURE_SMTP_USERNAME }}
          CI_FAILURE_SMTP_PASSWORD: ${{ secrets.CI_FAILURE_SMTP_PASSWORD }}
          CI_FAILURE_EMAIL_FROM: ${{ secrets.CI_FAILURE_EMAIL_FROM }}
        run: python3 .github/scripts/send_actions_failure_email.py
